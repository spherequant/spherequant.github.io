name: Build and publish to gh-pages

# Builds the Jekyll site from main and pushes the result to the gh-pages
# branch, which GitHub Pages already serves. No Pages settings change needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: bundle lock --add-platform x86_64-linux && bundle install
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          commit_message: "Deploy ${{ github.sha }}"
